- name: j05_causes_keep_null_and_zero
  description: Cas synthétiques indépendants des observations SNCF ; assertions du
    contrat J01.
  model: fct_delay_causes_monthly
  config:
    tags:
    - j05
  given:
  - input: ref('int_tgv_quality_flags')
    rows:
    - version_id: fixture
      month: '2026-01-01'
      departure_station: A
      arrival_station: B
      service_type: National
      scheduled_trains: 100
      cancelled_trains: 10
      operated_trains_proxy: 90
      arrival_delayed_trains: 18
      arrival_delayed_over_30_trains: 5
      arrival_delayed_over_60_trains: 2
      is_cancellation_rate_usable: true
      is_arrival_delay_rate_usable: true
      is_important_delay_rate_usable: true
      is_important_delay_count_usable: true
      row_number: 1
      cause_profile_status: missing
      is_cause_profile_usable: false
      cause_sum_pct: null
      has_cause_sum_warning: false
      external_cause_pct: null
      infrastructure_cause_pct: 0.0
      traffic_management_cause_pct: 40.0
      rolling_stock_cause_pct: 20.0
      station_management_cause_pct: 20.0
      passenger_handling_cause_pct: 20.0
  - input: ref('dim_route')
    rows: *id001
  - input: ref('dim_service')
    rows: *id002
  - input: ref('dim_cause')
    rows:
    - cause_key: external
      normalized_field: external_cause_pct
    - cause_key: infrastructure
      normalized_field: infrastructure_cause_pct
    - cause_key: traffic_management
      normalized_field: traffic_management_cause_pct
    - cause_key: rolling_stock
      normalized_field: rolling_stock_cause_pct
    - cause_key: station_management
      normalized_field: station_management_cause_pct
    - cause_key: passenger_handling
      normalized_field: passenger_handling_cause_pct
  expect:
    rows:
    - cause_key: external
      published_cause_pct: null
      cause_profile_status: missing
      is_cause_profile_usable: false
    - cause_key: infrastructure
      published_cause_pct: 0.0
      cause_profile_status: missing
      is_cause_profile_usable: false
    - cause_key: traffic_management
      published_cause_pct: 40.0
      cause_profile_status: missing
      is_cause_profile_usable: false
    - cause_key: rolling_stock
      published_cause_pct: 20.0
      cause_profile_status: missing
      is_cause_profile_usable: false
    - cause_key: station_management
      published_cause_pct: 20.0
      cause_profile_status: missing
      is_cause_profile_usable: false
    - cause_key: passenger_handling
      published_cause_pct: 20.0
      cause_profile_status: missing
      is_cause_profile_usable: false
